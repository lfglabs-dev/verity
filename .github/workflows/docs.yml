name: Docs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/docs.yml'
      - 'docs-site/**'
  pull_request:
    paths:
      - '.github/workflows/docs.yml'
      - 'docs-site/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Skip stale push builds
        id: freshness
        if: github.event_name == 'push'
        working-directory: .
        run: |
          git fetch --no-tags origin "${GITHUB_REF_NAME}"
          latest_sha="$(git rev-parse "origin/${GITHUB_REF_NAME}")"
          if [ "${latest_sha}" = "${GITHUB_SHA}" ]; then
            echo "should_build=true" >> "${GITHUB_OUTPUT}"
          else
            echo "should_build=false" >> "${GITHUB_OUTPUT}"
            echo "Skipping build: newer commit detected (${latest_sha})."
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.event_name != 'push' || steps.freshness.outputs.should_build == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - if: github.event_name != 'push' || steps.freshness.outputs.should_build == 'true'
        run: npm ci
      - if: github.event_name != 'push' || steps.freshness.outputs.should_build == 'true'
        run: npm run build
